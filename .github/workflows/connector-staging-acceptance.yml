name: connector-staging-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-staging-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restrict acceptance to the main repository branch
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "svobonek-lab/dashboard"
          test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check required staging configuration without printing values
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_PREVIEW_URL: ${{ vars.STAGING_PREVIEW_URL }}
          STAGING_OWNER_A_EMAIL: ${{ secrets.STAGING_OWNER_A_EMAIL }}
          STAGING_OWNER_A_PASSWORD: ${{ secrets.STAGING_OWNER_A_PASSWORD }}
          STAGING_EMPLOYEE_A_EMAIL: ${{ secrets.STAGING_EMPLOYEE_A_EMAIL }}
          STAGING_EMPLOYEE_A_PASSWORD: ${{ secrets.STAGING_EMPLOYEE_A_PASSWORD }}
          STAGING_OWNER_B_EMAIL: ${{ secrets.STAGING_OWNER_B_EMAIL }}
          STAGING_OWNER_B_PASSWORD: ${{ secrets.STAGING_OWNER_B_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY STAGING_PREVIEW_URL \
            STAGING_OWNER_A_EMAIL STAGING_OWNER_A_PASSWORD STAGING_EMPLOYEE_A_EMAIL \
            STAGING_EMPLOYEE_A_PASSWORD STAGING_OWNER_B_EMAIL STAGING_OWNER_B_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions variables/secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - run: npm ci
      - name: Verify company and employee isolation against isolated staging
        run: npm run test:connector:staging
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_OWNER_A_EMAIL: ${{ secrets.STAGING_OWNER_A_EMAIL }}
          STAGING_OWNER_A_PASSWORD: ${{ secrets.STAGING_OWNER_A_PASSWORD }}
          STAGING_EMPLOYEE_A_EMAIL: ${{ secrets.STAGING_EMPLOYEE_A_EMAIL }}
          STAGING_EMPLOYEE_A_PASSWORD: ${{ secrets.STAGING_EMPLOYEE_A_PASSWORD }}
          STAGING_OWNER_B_EMAIL: ${{ secrets.STAGING_OWNER_B_EMAIL }}
          STAGING_OWNER_B_PASSWORD: ${{ secrets.STAGING_OWNER_B_PASSWORD }}
      - name: Verify the reviewed Vercel Preview connector surface
        run: npm run test:connector:preview
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_PREVIEW_URL: ${{ vars.STAGING_PREVIEW_URL }}
          STAGING_PREVIEW_BYPASS_TOKEN: ${{ secrets.STAGING_PREVIEW_BYPASS_TOKEN }}
          STAGING_OWNER_A_EMAIL: ${{ secrets.STAGING_OWNER_A_EMAIL }}
          STAGING_OWNER_A_PASSWORD: ${{ secrets.STAGING_OWNER_A_PASSWORD }}
          CONNECTOR_EXPECTED_ID: ${{ vars.CONNECTOR_EXPECTED_ID }}
