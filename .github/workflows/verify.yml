          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261005_platform_admin_contract.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261009_platform_admin_support_contract.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261010_platform_admin_write_support_contract.sql
