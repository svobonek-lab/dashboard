name: verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: connector
      - run: npm test
      - run: npm run lint
      - run: npm run build

  ai-dispatcher-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL
        run: >-
          docker run --detach --name ai-dispatcher-postgres
          --env POSTGRES_PASSWORD=postgres
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s --health-timeout=2s --health-retries=30
          postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' ai-dispatcher-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs ai-dispatcher-postgres
          exit 1
      - name: Apply and verify the AI dispatcher contract
        run: |
          docker exec -i ai-dispatcher-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/tests/ai_dispatcher_setup.sql
          docker exec -i ai-dispatcher-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261006_ai_dispatcher_contract.sql
          docker exec -i ai-dispatcher-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/tests/ai_dispatcher_verify.sql
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm --force ai-dispatcher-postgres

  platform-support-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL
        run: >-
          docker run --detach --name platform-support-postgres
          --env POSTGRES_PASSWORD=postgres
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s --health-timeout=2s --health-retries=30
          postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' platform-support-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs platform-support-postgres
          exit 1
      - name: Apply and verify the platform support contract
        run: |
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/tests/platform_admin_setup.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261005_platform_admin_contract.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261009_platform_admin_support_contract.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261010_platform_admin_write_support_contract.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/tests/platform_admin_verify.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261012_platform_company_onboarding.sql
          docker exec -i platform-support-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/tests/platform_admin_company_onboarding.sql
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm --force platform-support-postgres
