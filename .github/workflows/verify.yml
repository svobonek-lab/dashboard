          docker exec -i public-intake-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261006_ai_dispatcher_contract.sql
          docker exec -i public-intake-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/migrations/20261026000000_public_intake_rate_limit.sql
