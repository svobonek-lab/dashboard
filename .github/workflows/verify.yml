      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm --force jwt-postgres

  jwt-tenant-pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build disposable PostgreSQL with pgTAP
        uses: docker/build-push-action@v5
        with:
          context: .
          file: supabase/tests/Dockerfile.jwt-pgtap
          platforms: linux/amd64
          load: true
          tags: jwt-pgtap
          cache-from: type=gha,scope=jwt-tenant-pgtap
          cache-to: type=gha,mode=max,scope=jwt-tenant-pgtap
      - name: Start disposable PostgreSQL
        run: docker run --detach --name jwt-pgtap-postgres --volume "$PWD:/workspace:ro" --env POSTGRES_PASSWORD=postgres jwt-pgtap
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec jwt-pgtap-postgres pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          docker logs jwt-pgtap-postgres
          exit 1
      - name: Prepare synthetic tenant fixture
        run: |
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE EXTENSION IF NOT EXISTS pgtap"
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/tests/jwt_tenant_setup.sql
          docker exec jwt-pgtap-postgres pg_prove --version
      - name: Prove the tenant test fails before the proposal
        run: |
          set +e
          docker exec jwt-pgtap-postgres pg_prove -U postgres -d postgres /workspace/supabase/tests/jwt_tenant_boundary_red.pgtap.sql > tenant-red.log 2>&1
          status=$?
          set -e
          cat tenant-red.log
          test "$status" -ne 0
          grep -q 'Tenant A sees only its own leads' tenant-red.log
          grep -q 'Looks like you failed 1 test of 1' tenant-red.log
      - name: Complete synthetic tenant fixture
        run: docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/tests/jwt_tenant_pgtap_setup.sql
      - name: Confirm pgTAP extension
        run: docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "SELECT extversion FROM pg_extension WHERE extname = 'pgtap'"
      - name: Prove the migration blocks unknown app_* tables
        run: |
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE TABLE public.app_unclassified_probe(id uuid)'
          set +e
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/migrations/20261025000000_secure_jwt_auth_hook.sql > tenant-preflight.log 2>&1
          status=$?
          set -e
          cat tenant-preflight.log
          test "$status" -ne 0
          grep -q 'public app_\* relation set differs' tenant-preflight.log
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'DROP TABLE public.app_unclassified_probe'
      - name: Apply the review proposal to the disposable fixture
        run: docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/migrations/20261025000000_secure_jwt_auth_hook.sql
      - name: Reject partial and altered tenant boundaries
        run: |
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'DROP POLICY app_leads_insert_owner ON public.app_leads'
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'CREATE POLICY app_leads_insert_owner ON public.app_leads FOR INSERT TO authenticated WITH CHECK (true)'
          set +e
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/migrations/20261025000000_secure_jwt_auth_hook.sql > tenant-policy.log 2>&1
          status=$?
          set -e
          cat tenant-policy.log
          test "$status" -ne 0
          grep -q 'rendered app_\* policy inventory or command/role contract differs' tenant-policy.log
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'DROP POLICY app_leads_insert_owner ON public.app_leads'
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE POLICY app_leads_insert_owner ON public.app_leads FOR INSERT TO authenticated WITH CHECK (app_private.app_role(company_id) = 'owner')"
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'DROP POLICY app_jwt_tenant_boundary ON public.app_invites'
          set +e
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/migrations/20261025000000_secure_jwt_auth_hook.sql > tenant-partial.log 2>&1
          status=$?
          set -e
          cat tenant-partial.log
          test "$status" -ne 0
          grep -q 'only 6 of 7 restrictive tenant boundaries exist' tenant-partial.log
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE POLICY app_jwt_tenant_boundary ON public.app_invites AS RESTRICTIVE FOR ALL TO authenticated USING (company_id = (SELECT app_private.jwt_tenant_id()) AND app_private.app_role(company_id) IS NOT NULL) WITH CHECK (company_id = (SELECT app_private.jwt_tenant_id()) AND app_private.app_role(company_id) IS NOT NULL)"
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'DROP POLICY app_jwt_tenant_boundary ON public.app_companies'
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE POLICY app_jwt_tenant_boundary ON public.app_companies AS RESTRICTIVE FOR ALL TO authenticated USING (id = (SELECT app_private.jwt_tenant_id()) OR TRUE) WITH CHECK (id = (SELECT app_private.jwt_tenant_id()) OR TRUE)"
          set +e
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/migrations/20261025000000_secure_jwt_auth_hook.sql > tenant-altered.log 2>&1
          status=$?
          set -e
          cat tenant-altered.log
          test "$status" -ne 0
          grep -q 'existing boundary on public.app_companies is incompatible' tenant-altered.log
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'DROP POLICY app_jwt_tenant_boundary ON public.app_companies'
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "CREATE POLICY app_jwt_tenant_boundary ON public.app_companies AS RESTRICTIVE FOR ALL TO authenticated USING (id = (SELECT app_private.jwt_tenant_id()) AND app_private.app_role(id) IS NOT NULL) WITH CHECK (id = (SELECT app_private.jwt_tenant_id()) AND app_private.app_role(id) IS NOT NULL)"
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'GRANT UPDATE (company_id) ON public.app_lead_events TO authenticated'
          set +e
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/migrations/20261025000000_secure_jwt_auth_hook.sql > tenant-column-grant.log 2>&1
          status=$?
          set -e
          cat tenant-column-grant.log
          test "$status" -ne 0
          grep -q 'authenticated mutation grants differ for public.app_lead_events' tenant-column-grant.log
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -c 'REVOKE UPDATE (company_id) ON public.app_lead_events FROM authenticated'
          docker exec jwt-pgtap-postgres psql -v ON_ERROR_STOP=1 -U postgres -f /workspace/supabase/migrations/20261025000000_secure_jwt_auth_hook.sql
      - name: Verify Auth hook and app_* RLS contracts
        run: |
          docker exec jwt-pgtap-postgres pg_prove -U postgres -d postgres /workspace/supabase/tests/jwt_tenant_auth_hook.pgtap.sql
          docker exec jwt-pgtap-postgres pg_prove -U postgres -d postgres /workspace/supabase/tests/jwt_tenant_rls.pgtap.sql
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm --force jwt-pgtap-postgres

