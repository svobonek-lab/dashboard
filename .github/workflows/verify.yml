name: verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: connector
      - run: npm test
      - run: npm run lint
      - run: npm run build

  legacy-migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start clean PostgreSQL 17
        run: >-
          docker run --detach --name legacy-migrations-postgres
          --env POSTGRES_PASSWORD=postgres
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s --health-timeout=2s --health-retries=30
          postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' legacy-migrations-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs legacy-migrations-postgres
          exit 1
      - name: Bootstrap synthetic Supabase Auth primitives
        run: docker exec -i legacy-migrations-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/tests/legacy_migration_chain_bootstrap.sql
      - name: Apply every historical migration in filename order
        run: |
          shopt -s nullglob
          migrations=(supabase/migrations/202609*.sql)
          if [ "${#migrations[@]}" -ne 10 ]; then
            echo "Expected the 10-file historical 202609 migration chain; found ${#migrations[@]}"
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Applying ${migration} to disposable PostgreSQL 17"
            docker exec -i legacy-migrations-postgres psql -v ON_ERROR_STOP=1 -U postgres < "$migration"
          done
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm --force legacy-migrations-postgres

  outbox-run-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL
        run: >-
          docker run --detach --name outbox-evidence-postgres
          --env POSTGRES_PASSWORD=postgres
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s --health-timeout=2s --health-retries=30
          postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' outbox-evidence-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs outbox-evidence-postgres
          exit 1
      - name: Apply and verify the isolated run evidence contract
        run: |
          docker exec outbox-evidence-postgres psql -v ON_ERROR_STOP=1 -U postgres -c "create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls;"
          docker exec -i outbox-evidence-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/staging/20261027_outbox_run_evidence.sql
          docker exec -i outbox-evidence-postgres psql -v ON_ERROR_STOP=1 -U postgres < supabase/tests/outbox_run_evidence_verify.sql
      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm --force outbox-evidence-postgres

