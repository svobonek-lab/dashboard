name: design-visual

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    name: design
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:design
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-test-results
          path: test-results/
          retention-days: 7
