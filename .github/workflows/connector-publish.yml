name: connector-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver already reviewed in connector/package.json
        required: true
        type: string
      staging_acceptance_run_id:
        description: Successful connector-staging-acceptance run ID for this exact main commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: connector-publish
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && github.repository == 'svobonek-lab/dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require successful acceptance for this exact main commit
        run: npx tsx scripts/connector-release-evidence.ts
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          STAGING_ACCEPTANCE_RUN_ID: ${{ inputs.staging_acceptance_run_id }}
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'svobonek-lab/dashboard'
    uses: ./.github/workflows/connector-verify.yml
    needs: acceptance

  publish:
    needs: [acceptance, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate reviewed version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$REQUESTED_VERSION" = "$(node -p "require('./connector/package.json').version")"
          echo "$REQUESTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish version and source-commit tags
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: connector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=stavbaflow-connector
          cache-to: type=gha,mode=max,scope=stavbaflow-connector
          tags: |
            ghcr.io/svobonek-lab/stavbaflow-connector:${{ inputs.version }}
            ghcr.io/svobonek-lab/stavbaflow-connector:sha-${{ github.sha }}
      - name: Create immutable release manifest
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node -e "const fs=require('fs'); const out={version:process.env.VERSION,image:'ghcr.io/svobonek-lab/stavbaflow-connector',digest:process.env.DIGEST,publishedAt:new Date().toISOString(),sourceCommit:process.env.SOURCE_COMMIT}; if(!/^sha256:[a-f0-9]{64}$/.test(out.digest)) process.exit(1); fs.writeFileSync('connector-manifest.json',JSON.stringify(out,null,2)+'\n')"
      - name: Publish immutable image and complete Synology install bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "connector-v${{ inputs.version }}"
          connector-manifest.json
          docker-compose.synology.yml
          connector/config.example.json
          connector/compose.yaml
          connector/scripts/install.ps1
          connector/scripts/update.ps1
          docs/synology-connector-install.md
          docs/synology-connector-operations.md
          --repo "$GITHUB_REPOSITORY"
          --title "StavbaFlow connector ${{ inputs.version }}"
          --notes "Immutable digest release from $GITHUB_SHA. Staging acceptance run: ${{ inputs.staging_acceptance_run_id }}"
          --latest
