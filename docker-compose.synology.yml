name: stavbaflow-connector

services:
  connector:
    image: ${STAVBAFLOW_CONNECTOR_IMAGE:?Set a verified connector image digest}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      STAVBAFLOW_CONNECTOR_CONFIG: /etc/stavbaflow/config.json
      DB_HOST: ${DB_HOST:?Set the address reachable from the NAS}
      DB_PORT: ${DB_PORT:?Set the database TCP port}
    volumes:
      - /volume1/docker/stavbaflow/config:/etc/stavbaflow:ro
      - /volume1/docker/stavbaflow/state:/var/lib/stavbaflow:rw
    secrets:
      - source_db_password
      - source_db_write_password
      - connector_identity
      - enrollment_code
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    pids_limit: 128
    mem_limit: 512m

secrets:
  source_db_password:
    file: /volume1/docker/stavbaflow/secrets/source-db-password
  source_db_write_password:
    file: /volume1/docker/stavbaflow/secrets/source-db-write-password
  connector_identity:
    file: /volume1/docker/stavbaflow/secrets/connector-identity
  enrollment_code:
    file: ${CONNECTOR_SECRET:?Set the absolute path to the enrollment-code secret file}
